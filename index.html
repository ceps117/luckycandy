<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dulcería con Ruleta</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      background:white;
      width:100%;
      max-width:700px;
      border-radius:25px;
      padding:30px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      text-align:center;
    }

    h1{
      color:#ff4d6d;
      margin-bottom:10px;
    }

    p{
      color:#555;
      margin-bottom:20px;
    }

    .dulces{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
      gap:15px;
      margin-bottom:30px;
    }

    .dulce{
      background:#fff0f3;
      border-radius:20px;
      padding:15px;
      transition:0.3s;
</html>
